<style>
  /* Tokens de design/theme.css (modo claro y oscuro según el sistema) */
  :root {
    color-scheme: light dark;
    --canvas: oklch(0.984 0.005 85);
    --surface: oklch(1 0 0);
    --surface-2: oklch(0.964 0.007 85);
    --surface-3: oklch(0.935 0.009 85);
    --line: oklch(0.912 0.009 85);
    --line-strong: oklch(0.84 0.012 85);
    --ink: oklch(0.22 0.022 285);
    --ink-2: oklch(0.42 0.02 285);
    --ink-3: oklch(0.53 0.016 285);
    --brand: oklch(0.5 0.2 285);
    --brand-strong: oklch(0.44 0.19 285);
    --brand-soft: oklch(0.95 0.03 285);
    --on-brand: oklch(0.99 0.005 285);
    --gold: oklch(0.78 0.14 78);
    --warn: oklch(0.52 0.12 60);
    --warn-soft: oklch(0.96 0.05 85);
    --shadow-a: oklch(0.25 0.03 285 / 0.06);
    --shadow-b: oklch(0.25 0.05 285 / 0.18);
    --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
    --font-display: "Fraunces", ui-serif, Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: oklch(0.16 0.014 285);
      --surface: oklch(0.198 0.016 285);
      --surface-2: oklch(0.232 0.018 285);
      --surface-3: oklch(0.27 0.02 285);
      --line: oklch(0.285 0.018 285);
      --line-strong: oklch(0.37 0.02 285);
      --ink: oklch(0.95 0.008 85);
      --ink-2: oklch(0.79 0.012 285);
      --ink-3: oklch(0.65 0.014 285);
      --brand: oklch(0.72 0.15 285);
      --brand-strong: oklch(0.8 0.12 285);
      --brand-soft: oklch(0.3 0.07 285);
      --on-brand: oklch(0.17 0.03 285);
      --gold: oklch(0.8 0.13 80);
      --warn: oklch(0.82 0.12 75);
      --warn-soft: oklch(0.3 0.05 70);
      --shadow-a: oklch(0 0 0 / 0.3);
      --shadow-b: oklch(0 0 0 / 0.55);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.45 var(--font-sans); }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 0 16px; }

  /* Cabecera */
  header.top { padding-top: 20px; padding-bottom: 8px; }
  .eyebrow { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  h1 { margin: 2px 0 0; font: 600 30px/1.1 var(--font-display); letter-spacing: -0.01em; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 0 0; padding: 0; list-style: none; color: var(--ink-2); }
  .stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Barra de controles, fija arriba al hacer scroll */
  .bar { position: sticky; top: 0; z-index: 30; background: color-mix(in oklab, var(--canvas) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-top: 10px; padding-bottom: 10px; }
  .search { flex: 1 1 200px; max-width: 280px; height: 34px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); outline: none; }
  .search:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in oklab, var(--brand) 18%, transparent); }
  .ctl { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 13px; }
  .ctl select { height: 30px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); padding: 0 6px; }
  .ctl input[type=range] { width: 90px; accent-color: var(--brand); }
  .ctl input[type=checkbox] { accent-color: var(--brand); }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font-weight: 500; cursor: pointer; }
  .btn:hover { background: var(--surface-2); }
  .push { margin-left: auto; }

  .notice { margin: 12px 0 0; padding: 8px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); }
  .empty { padding: 48px 0; text-align: center; color: var(--ink-3); }

  /* Todas las cartas en una sola cuadrícula; cada grupo empieza con una carta separadora */
  main { padding: 16px 0 40px; }
  .board { --w: 132px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--w), calc((100vw - 52px) / 3)), 1fr)); gap: 12px 10px; margin: 0; padding: 0; list-style: none; }
  .card:hover .art, .card:focus-visible .art { transform: translateY(-3px); box-shadow: 0 2px 6px var(--shadow-a), 0 18px 36px -14px var(--shadow-b); }
  .divider .dv { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; aspect-ratio: 488 / 680; padding: 10px; border-radius: 4.75% / 3.4%; text-align: center;
    border: 1.5px solid color-mix(in oklab, var(--tint, var(--line-strong)) 50%, var(--line)); background: color-mix(in oklab, var(--tint, var(--surface-3)) 16%, var(--surface)); }
  .divider h2 { margin: 0; font: 600 18px/1.15 var(--font-display); }
  .divider small { color: var(--ink-3); font-size: 12px; }
  .divider .sym { width: 36px; height: 36px; }
  .gold-dot { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, oklch(0.85 0.12 90), oklch(0.7 0.13 70)); box-shadow: inset 0 0 0 1px oklch(0 0 0 / .2); }

  /* Vista ampliada al pasar el ratón */
  #peek { position: fixed; z-index: 50; width: 300px; pointer-events: none; border-radius: 4.75% / 3.4%; overflow: hidden; box-shadow: 0 2px 6px var(--shadow-a), 0 24px 48px -16px var(--shadow-b); }
  #peek[hidden] { display: none; }
  #peek img { display: block; width: 100%; aspect-ratio: 488 / 680; }

  /* Carta */
  .card { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 4.75% / 3.4%; }
  .card:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .art { display: block; position: relative; aspect-ratio: 488 / 680; border-radius: 4.75% / 3.4%; overflow: hidden; background: var(--surface-3); box-shadow: 0 1px 2px var(--shadow-a); transition: transform .12s, box-shadow .12s; }
  .art .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 8px; text-align: center; font: 500 12px var(--font-display); color: var(--ink-3); }
  .art img { position: relative; display: block; width: 100%; height: 100%; object-fit: cover; }
  .art.foil::after { content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light; opacity: .55;
    background: linear-gradient(115deg, oklch(0.9 0.12 340), oklch(0.92 0.1 250) 35%, oklch(0.93 0.12 160) 65%, oklch(0.93 0.13 85)); }
  .badges { position: absolute; top: 3.5%; right: 4%; display: flex; gap: 3px; z-index: 2; }
  .badges b { padding: 1px 6px; border-radius: 999px; font-size: 11px; font-weight: 700; line-height: 16px; font-variant-numeric: tabular-nums; box-shadow: 0 1px 2px oklch(0 0 0 / .35); }
  .badges .qty { background: oklch(0.2 0.02 285 / .88); color: white; }
  .badges .fo { background: linear-gradient(115deg, oklch(0.9 0.08 340), oklch(0.92 0.07 250) 35%, oklch(0.93 0.09 160) 65%, oklch(0.93 0.1 85)); color: oklch(0.25 0.03 285); }
  .art .ph { overflow: hidden; }
  .cap { display: flex; justify-content: space-between; gap: 6px; margin-top: 3px; padding: 0 2px; font-size: 12px; }
  .cap .nm { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--ink-2); }
  .cap .pr { flex: none; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Ficha de la carta */
  dialog { width: min(820px, calc(100% - 32px)); max-height: calc(100% - 32px); padding: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); box-shadow: 0 24px 64px -20px var(--shadow-b); }
  dialog::backdrop { background: oklch(0.2 0.02 285 / .55); }
  .dlg { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 20px; padding: 20px; }
  .dlg .imgs { display: grid; gap: 10px; }
  .dlg h3 { margin: 0; font: 600 24px/1.15 var(--font-display); }
  .dlg .meta { margin: 6px 0 0; color: var(--ink-2); }
  .dlg .cost img { width: 16px; height: 16px; vertical-align: -3px; margin-left: 1px; }
  .dlg .text { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); white-space: pre-line; }
  .dlg table { width: 100%; margin-top: 14px; border-collapse: collapse; font-size: 13px; }
  .dlg th { text-align: left; font-weight: 500; color: var(--ink-3); border-bottom: 1px solid var(--line); padding: 4px 6px; }
  .dlg td { border-bottom: 1px solid var(--line); padding: 6px; font-variant-numeric: tabular-nums; }
  .dlg td.num, .dlg th.num { text-align: right; }
  .dlg a { color: var(--brand-strong); }
  .close { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border: 0; border-radius: 8px; background: var(--surface-2); font-size: 18px; cursor: pointer; }
  .tag-foil { padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; background: linear-gradient(115deg, oklch(0.9 0.08 340), oklch(0.92 0.07 250) 35%, oklch(0.93 0.09 160) 65%, oklch(0.93 0.1 85)); color: oklch(0.25 0.03 285); }
  @media (max-width: 640px) { .search { flex-basis: 100%; max-width: none; } .push { margin-left: 0; } .board { gap: 14px 16px; } }
  @media (max-width: 640px) { .dlg { grid-template-columns: 1fr; } .dlg .imgs { max-width: 240px; margin: 0 auto; } h1 { font-size: 24px; } }

  body.dragging main { outline: 3px dashed var(--brand); outline-offset: -8px; border-radius: 16px; }
</style>

<header class="top wrap">
  <p class="eyebrow">Colección · search-magic</p>
  <h1 id="title">Colección</h1>
  <ul class="stats" id="stats"></ul>
  <p class="notice" id="notice" hidden></p>
</header>

<div class="bar">
  <div class="wrap">
    <input class="search" id="q" type="search" placeholder="Buscar carta o tipo…" aria-label="Buscar carta">
    <label class="ctl">Agrupar
      <select id="group">
        <option value="color">por color</option>
        <option value="type">por tipo</option>
        <option value="rarity">por rareza</option>
        <option value="cmc">por coste</option>
        <option value="none">sin grupos</option>
      </select>
    </label>
    <label class="ctl">Ordenar
      <select id="sort">
        <option value="cmc">coste y nombre</option>
        <option value="name">nombre</option>
        <option value="price">precio</option>
        <option value="number">número</option>
      </select>
    </label>
    <label class="ctl">Tamaño <input id="size" type="range" min="90" max="240" step="4"></label>
    <label class="ctl" title="Cada impresión distinta de una carta (p. ej. una versión sin borde) en su propio hueco"><input id="split" type="checkbox"> Separar versiones</label>
    <label class="btn push" for="file">Cargar otro CSV</label>
    <input id="file" type="file" accept=".csv,text/csv" hidden>
  </div>
</div>

<main class="wrap">
  <div class="board" id="board"></div>
</main>

<dialog id="dialog" aria-labelledby="dlg-title"></dialog>
<div id="peek" hidden></div>

<script>
"use strict";

// ---------- Datos ----------
const cache = new Map(JSON.parse(document.getElementById("card-data").textContent).map((c) => [c.id, c]));
const euros = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });
const money = (cents) => (cents == null ? "—" : euros.format(cents / 100));
const toCents = (v) => { const n = Number.parseFloat(v); return Number.isFinite(n) ? Math.round(n * 100) : null; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fold = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const num = (cn) => { const n = Number.parseInt(cn, 10); return Number.isFinite(n) ? n : 1e6; };

function splitCsvLine(line) {
  const out = []; let field = ""; let quoted = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (quoted) {
      if (ch === '"' && line[i + 1] === '"') { field += '"'; i++; }
      else if (ch === '"') quoted = false;
      else field += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ",") { out.push(field); field = ""; }
    else field += ch;
  }
  out.push(field);
  return out.map((f) => f.trim());
}

/** CSV de ManaBox → líneas { id, set, cn, name, finish, qty, paid } */
function parseCsv(text) {
  const lines = text.replace(/^﻿/, "").split(/\r?\n/).filter((l) => l.trim());
  const head = splitCsvLine(lines[0] ?? "").map((c) => c.toLowerCase());
  const col = (n) => head.indexOf(n);
  const [iName, iQty, iId, iSet, iCn, iFoil, iPaid] = ["name", "quantity", "scryfall id", "set code", "collector number", "foil", "purchase price"].map(col);
  if (iName < 0 || iQty < 0) throw new Error("El CSV no tiene las columnas Name y Quantity de ManaBox");
  return lines.slice(1).map((line) => {
    const f = splitCsvLine(line);
    return {
      name: f[iName], qty: Number.parseInt(f[iQty], 10) || 0,
      id: (f[iId] || "").toLowerCase(), set: (f[iSet] || "").toLowerCase(), cn: f[iCn] || "",
      finish: (f[iFoil] || "normal").toLowerCase() === "normal" ? "normal" : (f[iFoil] || "").toLowerCase(),
      paid: iPaid >= 0 ? toCents(f[iPaid]) : null,
    };
  }).filter((r) => r.name && r.qty > 0);
}

/** Pide a Scryfall las cartas que no están en la caché (por id o por edición y número) */
async function fetchMissing(rows) {
  const want = new Map();
  for (const r of rows) {
    if (r.id && !cache.has(r.id)) want.set(`id:${r.id}`, { id: r.id });
    else if (!r.id && r.set && r.cn && !findBySetCn(r.set, r.cn)) want.set(`sc:${r.set}:${r.cn}`, { set: r.set, collector_number: r.cn });
  }
  const ids = [...want.values()];
  for (let i = 0; i < ids.length; i += 75) {
    const res = await fetch("https://api.scryfall.com/cards/collection", {
      method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ identifiers: ids.slice(i, i + 75) }),
    });
    if (!res.ok) throw new Error(`Scryfall respondió ${res.status}`);
    for (const c of (await res.json()).data) cache.set(c.id, slim(c));
    await new Promise((r) => setTimeout(r, 120));
  }
}
const findBySetCn = (set, cn) => [...cache.values()].find((c) => c.set === set && c.cn === cn);

function slim(c) {
  const faces = c.card_faces ?? [];
  const img = (x) => x?.image_uris?.normal ?? null;
  return {
    id: c.id, oracle: c.oracle_id ?? faces[0]?.oracle_id ?? c.id, name: c.name, set: c.set, setName: c.set_name, cn: c.collector_number,
    rarity: c.rarity, layout: c.layout, type: c.type_line ?? faces.map((f) => f.type_line).join(" // "),
    cost: c.mana_cost ?? faces.map((f) => f.mana_cost).filter(Boolean).join(" // "), cmc: c.cmc ?? 0,
    colors: c.colors ?? faces[0]?.colors ?? [], identity: c.color_identity ?? [],
    text: c.oracle_text ?? faces.map((f) => f.oracle_text).filter(Boolean).join("\n—\n"),
    img: img(c) ?? img(faces[0]), back: img(c) ? null : img(faces[1]),
    eur: c.prices?.eur ?? null, eurFoil: c.prices?.eur_foil ?? null, url: c.scryfall_uri?.split("?")[0] ?? null,
  };
}

// ---------- Colección: líneas por impresión y acabado, y entradas por carta ----------
let collection = { title: "", lines: [], missing: [] };

function buildCollection(rows, title) {
  const byKey = new Map();
  const missing = [];
  for (const r of rows) {
    const card = (r.id && cache.get(r.id)) || (r.set && r.cn && findBySetCn(r.set, r.cn));
    if (!card) { missing.push(`${r.qty} ${r.name}`); continue; }
    // Una misma impresión y acabado en varias líneas del CSV se suma
    const key = `${card.id}|${r.finish}`;
    const line = byKey.get(key) ?? { card, finish: r.finish, qty: 0, paid: 0, paidKnown: false };
    line.qty += r.qty;
    if (r.paid != null) { line.paid += r.paid * r.qty; line.paidKnown = true; }
    byKey.set(key, line);
  }
  collection = { title, lines: [...byKey.values()], missing };
}

/** Precio actual de una línea en Cardmarket (vía Scryfall); si no hay, el de compra del CSV */
function lineValue(l) {
  const unit = toCents(l.finish === "normal" ? l.card.eur : (l.card.eurFoil ?? l.card.eur));
  if (unit != null) return unit * l.qty;
  return l.paidKnown ? l.paid : null;
}

function entries() {
  const map = new Map();
  for (const l of collection.lines) {
    const key = settings.split ? l.card.id : l.card.oracle;
    const e = map.get(key) ?? { key, lines: [], qty: 0, foil: 0, value: 0, valueKnown: false };
    e.lines.push(l);
    e.qty += l.qty;
    if (l.finish !== "normal") e.foil += l.qty;
    const v = lineValue(l);
    if (v != null) { e.value += v; e.valueKnown = true; }
    map.set(key, e);
  }
  for (const e of map.values()) {
    e.lines.sort((a, b) => num(a.card.cn) - num(b.card.cn) || (a.finish === "normal" ? -1 : 1));
    e.card = e.lines[0].card; // la impresión de número más bajo: la normal
    e.versions = new Set(e.lines.map((l) => l.card.id)).size;
  }
  return [...map.values()];
}

// ---------- Grupos y orden ----------
const isToken = (c) => c.layout === "token" || c.layout === "double_faced_token" || /\bToken\b/.test(c.type);
const front = (c) => c.type.split(" // ")[0];
const isLand = (c) => /\bLand\b/.test(front(c));

const GROUPS = {
  color: {
    order: [["W", "Blanco"], ["U", "Azul"], ["B", "Negro"], ["R", "Rojo"], ["G", "Verde"], ["M", "Multicolor"], ["C", "Incoloras"], ["L", "Tierras"], ["T", "Fichas"]],
    of: (c) => isToken(c) ? "T" : isLand(c) ? "L" : c.colors.length > 1 ? "M" : c.colors[0] ?? "C",
  },
  type: {
    order: [["creature", "Criaturas"], ["planeswalker", "Planeswalkers"], ["instant", "Instantáneos"], ["sorcery", "Conjuros"], ["artifact", "Artefactos"], ["enchantment", "Encantamientos"], ["battle", "Batallas"], ["land", "Tierras"], ["token", "Fichas"], ["other", "Otras"]],
    of: (c) => {
      if (isToken(c)) return "token";
      const t = front(c);
      for (const [k, re] of [["land", /\bLand\b/], ["creature", /\bCreature\b/], ["planeswalker", /\bPlaneswalker\b/], ["instant", /\bInstant\b/], ["sorcery", /\bSorcery\b/], ["artifact", /\bArtifact\b/], ["enchantment", /\bEnchantment\b/], ["battle", /\bBattle\b/]]) if (re.test(t)) return k;
      return "other";
    },
  },
  rarity: {
    order: [["mythic", "Míticas"], ["rare", "Raras"], ["uncommon", "Infrecuentes"], ["common", "Comunes"], ["special", "Especiales"], ["token", "Fichas"]],
    of: (c) => isToken(c) ? "token" : ["mythic", "rare", "uncommon", "common"].includes(c.rarity) ? c.rarity : "special",
  },
  cmc: {
    order: [["0", "Coste 0"], ["1", "Coste 1"], ["2", "Coste 2"], ["3", "Coste 3"], ["4", "Coste 4"], ["5", "Coste 5"], ["6", "Coste 6"], ["7", "Coste 7+"], ["land", "Tierras"], ["token", "Fichas"]],
    of: (c) => isToken(c) ? "token" : isLand(c) ? "land" : String(Math.min(7, Math.floor(c.cmc))),
  },
  none: { order: [["all", "Todas"]], of: () => "all" },
};
const SYMBOL = { W: "W", U: "U", B: "B", R: "R", G: "G", C: "C" };

const SORTS = {
  cmc: (a, b) => a.card.cmc - b.card.cmc || a.card.name.localeCompare(b.card.name),
  name: (a, b) => a.card.name.localeCompare(b.card.name),
  price: (a, b) => (b.valueKnown ? b.value / b.qty : -1) - (a.valueKnown ? a.value / a.qty : -1) || a.card.name.localeCompare(b.card.name),
  number: (a, b) => a.card.set.localeCompare(b.card.set) || num(a.card.cn) - num(b.card.cn),
};

// ---------- Ajustes (se recuerdan en este navegador si se puede) ----------
const DEFAULTS = { group: "color", sort: "cmc", size: 132, split: false };
const STORE = "sm-coleccion-v2";
let settings = { ...DEFAULTS };
try { Object.assign(settings, JSON.parse(localStorage.getItem(STORE) || "{}")); } catch {}
const saveSettings = () => { try { localStorage.setItem(STORE, JSON.stringify(settings)); } catch {} };

// ---------- Pintar ----------
const board = document.getElementById("board");
const TINT = { W: "oklch(0.85 0.09 95)", U: "oklch(0.62 0.14 245)", B: "oklch(0.4 0.03 300)", R: "oklch(0.62 0.18 30)", G: "oklch(0.62 0.14 150)", M: "oklch(0.78 0.13 80)", C: "oklch(0.72 0.02 250)", L: "oklch(0.6 0.07 60)" };

function tile(e, withCaption = true) {
  const allFoil = e.foil === e.qty;
  const badges = (e.qty > 1 ? `<b class="qty">×${e.qty}</b>` : "") + (e.foil && !allFoil ? `<b class="fo" title="${e.foil} foil">${e.foil}✦</b>` : "") + (allFoil ? `<b class="fo" title="Foil">✦</b>` : "");
  const label = `${e.card.name}${e.qty > 1 ? ` (${e.qty} copias${e.foil ? `, ${e.foil} foil` : ""})` : e.foil ? " (foil)" : ""}${e.versions > 1 ? ` · ${e.versions} versiones` : ""}`;
  return `<li><button type="button" class="card" data-key="${esc(e.key)}" title="${esc(label)}" aria-label="${esc(label)}">
    <span class="art${allFoil ? " foil" : ""}"><span class="ph">${esc(e.card.name)}</span>${e.card.img ? `<img src="${esc(e.card.img)}" alt="" loading="lazy" decoding="async">` : ""}${badges ? `<span class="badges">${badges}</span>` : ""}</span>
    ${withCaption ? `<span class="cap"><span class="nm">${esc(e.card.name)}${e.versions > 1 ? ` · ${e.versions} v.` : ""}</span><span class="pr">${e.valueKnown ? money(e.value) : "—"}</span></span>` : ""}
  </button></li>`;
}

/** Carta separadora con la que empieza cada grupo (ocupa un hueco, no una fila) */
function divider(key, label, list) {
  const count = list.reduce((s, e) => s + e.qty, 0);
  const byColor = settings.group === "color";
  const icon = byColor ? (SYMBOL[key] ? `<img class="sym" src="https://svgs.scryfall.io/card-symbols/${SYMBOL[key]}.svg" alt="">` : key === "M" ? `<span class="gold-dot" aria-hidden="true"></span>` : "") : "";
  const tint = byColor && TINT[key] ? ` style="--tint: ${TINT[key]}"` : "";
  return `<li class="divider"><div class="dv"${tint}>${icon}<h2>${esc(label)}</h2><small>${count === 1 ? "1 carta" : `${count} cartas`}</small></div></li>`;
}

function render() {
  const all = entries();
  const q = fold(document.getElementById("q").value.trim());
  const shown = q ? all.filter((e) => fold(`${e.card.name} ${e.card.type}`).includes(q)) : all;
  const def = GROUPS[settings.group] ?? GROUPS.color;
  const buckets = new Map(def.order.map(([k]) => [k, []]));
  for (const e of shown) buckets.get(def.of(e.card))?.push(e);

  board.style.setProperty("--w", `${settings.size}px`);
  const cells = [];
  for (const [key, label] of def.order) {
    const list = buckets.get(key).sort(SORTS[settings.sort] ?? SORTS.cmc);
    if (!list.length) continue;
    if (settings.group !== "none") cells.push(divider(key, label, list));
    cells.push(...list.map((e) => tile(e)));
  }
  board.innerHTML = cells.length ? `<ul class="tiles">${cells.join("")}</ul>` : `<p class="empty">${q ? "Ninguna carta coincide con la búsqueda." : "No hay cartas."}</p>`;
  board._entries = new Map(all.map((e) => [e.key, e]));
  renderStats(all);
}

function renderStats(all) {
  const lines = collection.lines;
  const total = lines.reduce((s, l) => s + l.qty, 0);
  const tokens = lines.filter((l) => isToken(l.card)).reduce((s, l) => s + l.qty, 0);
  const foil = lines.filter((l) => l.finish !== "normal").reduce((s, l) => s + l.qty, 0);
  const distinct = new Set(lines.filter((l) => !isToken(l.card)).map((l) => l.card.oracle)).size;
  const value = lines.reduce((s, l) => s + (lineValue(l) ?? 0), 0);
  const paid = lines.reduce((s, l) => s + (l.paidKnown ? l.paid : 0), 0);
  const top = [...all].filter((e) => e.valueKnown).sort((a, b) => b.value - a.value)[0];
  document.getElementById("title").textContent = collection.title;
  document.title = `${collection.title} · Colección`;
  document.getElementById("stats").innerHTML = [
    `<li><b>${total - tokens}</b> cartas${tokens ? ` + ${tokens} fichas` : ""}</li>`,
    `<li><b>${distinct}</b> distintas</li>`,
    `<li><b>${foil}</b> foil</li>`,
    `<li>Valor hoy <b>${money(value)}</b> <span title="Precio de Cardmarket vía Scryfall">(Cardmarket)</span></li>`,
    paid ? `<li>Al añadirlas <b>${money(paid)}</b></li>` : "",
    top ? `<li>La más cara: <b>${esc(top.card.name)}</b> ${money(top.value / top.qty)}</li>` : "",
  ].join("");
  const notice = document.getElementById("notice");
  notice.hidden = !collection.missing.length;
  notice.textContent = collection.missing.length ? `No se han encontrado en Scryfall: ${collection.missing.join(", ")}.` : "";
}

// ---------- Ficha ----------
const dialog = document.getElementById("dialog");
const FINISH = { normal: "Normal", foil: "Foil", etched: "Etched" };
const RARITY = { mythic: "Mítica", rare: "Rara", uncommon: "Infrecuente", common: "Común", special: "Especial", bonus: "Bonus" };
const costHtml = (cost) => esc(cost).replace(/\{([^}]+)\}/g, (_, s) => `<img src="https://svgs.scryfall.io/card-symbols/${s.replace(/\//g, "")}.svg" alt="{${s}}">`);

function openCard(e) {
  const c = e.card;
  const versions = [...new Map(e.lines.map((l) => [l.card.id, l.card])).values()];
  const images = versions.flatMap((v) => [v.img, v.back]).filter(Boolean);
  dialog.innerHTML = `<button type="button" class="close" aria-label="Cerrar">×</button>
    <div class="dlg">
      <div class="imgs">${images.map((src, i) => `<span class="art"><img src="${esc(src)}" alt="${esc(c.name)}${i ? ` (${i + 1})` : ""}"></span>`).join("")}</div>
      <div>
        <h3 id="dlg-title">${esc(c.name)}</h3>
        <p class="meta">${esc(c.type)} <span class="cost">${costHtml(c.cost)}</span></p>
        <p class="meta">${esc(c.setName ?? c.set.toUpperCase())} · ${RARITY[c.rarity] ?? esc(c.rarity)} · <b>${e.qty}</b> ${e.qty === 1 ? "copia" : "copias"}${e.versions > 1 ? ` en ${e.versions} versiones` : ""}</p>
        ${c.text ? `<p class="text" lang="en">${esc(c.text)}</p>` : ""}
        <table>
          <thead><tr><th>Versión</th><th>Acabado</th><th class="num">Copias</th><th class="num">Hoy (ud.)</th><th class="num">Al añadirla</th></tr></thead>
          <tbody>${e.lines.map((l) => {
            const unit = toCents(l.finish === "normal" ? l.card.eur : (l.card.eurFoil ?? l.card.eur));
            return `<tr>
              <td>${l.card.url ? `<a href="${esc(l.card.url)}" target="_blank" rel="noopener noreferrer">${esc(l.card.set.toUpperCase())} #${esc(l.card.cn)}</a>` : `${esc(l.card.set.toUpperCase())} #${esc(l.card.cn)}`}</td>
              <td>${l.finish === "normal" ? "Normal" : `<span class="tag-foil">${FINISH[l.finish] ?? esc(l.finish)}</span>`}</td>
              <td class="num">${l.qty}</td>
              <td class="num">${money(unit)}</td>
              <td class="num">${l.paidKnown ? money(l.paid / l.qty) : "—"}</td>
            </tr>`;
          }).join("")}</tbody>
        </table>
      </div>
    </div>`;
  dialog.showModal();
}
dialog.addEventListener("click", (ev) => { if (ev.target === dialog || ev.target.closest(".close")) dialog.close(); });
board.addEventListener("click", (ev) => {
  const btn = ev.target.closest(".card");
  const e = btn && board._entries?.get(btn.dataset.key);
  if (e) openCard(e);
});

// ---------- Vista ampliada al pasar el ratón (solo con ratón y pantalla ancha) ----------
const peek = document.getElementById("peek");
const PEEK_W = 300, PEEK_H = Math.round(300 * 680 / 488), GAP = 14;
const hidePeek = () => { peek.hidden = true; };
if (matchMedia("(hover: hover) and (pointer: fine)").matches) {
  board.addEventListener("mouseover", (ev) => {
    const btn = ev.target.closest(".card");
    const e = btn && board._entries?.get(btn.dataset.key);
    if (!e?.card.img || innerWidth < 720) return hidePeek();
    const r = btn.querySelector(".art").getBoundingClientRect();
    if (peek.dataset.key !== e.key) { peek.innerHTML = `<img src="${esc(e.card.img)}" alt="">`; peek.dataset.key = e.key; }
    // A la derecha de la carta si cabe; si no, a la izquierda
    const x = r.right + GAP + PEEK_W <= innerWidth - 8 ? r.right + GAP : r.left - GAP - PEEK_W;
    const y = Math.min(Math.max(8, r.top + r.height / 2 - PEEK_H / 2), innerHeight - PEEK_H - 8);
    peek.style.left = `${x}px`;
    peek.style.top = `${y}px`;
    peek.hidden = false;
  });
  board.addEventListener("mouseleave", hidePeek);
  addEventListener("scroll", hidePeek, { passive: true });
}

// ---------- Controles ----------
function syncControls() {
  document.getElementById("group").value = settings.group;
  document.getElementById("sort").value = settings.sort;
  document.getElementById("size").value = settings.size;
  document.getElementById("split").checked = settings.split;
}
function set(patch) { Object.assign(settings, patch); saveSettings(); syncControls(); render(); }

document.getElementById("group").addEventListener("change", (ev) => set({ group: ev.target.value }));
document.getElementById("sort").addEventListener("change", (ev) => set({ sort: ev.target.value }));
document.getElementById("size").addEventListener("input", (ev) => set({ size: Number(ev.target.value) }));
document.getElementById("split").addEventListener("change", (ev) => set({ split: ev.target.checked }));
document.getElementById("q").addEventListener("input", render);

async function loadCsv(text, name) {
  const notice = document.getElementById("notice");
  try {
    const rows = parseCsv(text);
    notice.hidden = false; notice.textContent = "Pidiendo las cartas a Scryfall…";
    await fetchMissing(rows);
    buildCollection(rows, name);
    render();
  } catch (err) {
    notice.hidden = false; notice.textContent = err instanceof Error ? err.message : "No se ha podido leer el CSV";
  }
}
const titleOf = (fileName) => fileName.replace(/\.csv$/i, "").replace(/(^|\s)\S/g, (m) => m.toUpperCase());
document.getElementById("file").addEventListener("change", async (ev) => {
  const file = ev.target.files?.[0];
  if (file) await loadCsv(await file.text(), titleOf(file.name));
  ev.target.value = "";
});
// También se puede soltar el CSV encima de la página
addEventListener("dragover", (ev) => { ev.preventDefault(); document.body.classList.add("dragging"); });
addEventListener("dragleave", (ev) => { if (!ev.relatedTarget) document.body.classList.remove("dragging"); });
addEventListener("drop", async (ev) => {
  ev.preventDefault(); document.body.classList.remove("dragging");
  const file = ev.dataTransfer?.files?.[0];
  if (file) await loadCsv(await file.text(), titleOf(file.name));
});

// ---------- Arranque con el CSV incluido ----------
syncControls();
const embedded = document.getElementById("csv-data");
loadCsv(embedded.textContent.trim(), embedded.dataset.name);
</script>
</body>
</html>
