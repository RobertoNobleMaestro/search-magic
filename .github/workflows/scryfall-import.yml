# Actualiza el catálogo y los precios de referencia desde el bulk data de Scryfall.
# Secretos del repositorio:
#   DATABASE_URL_UNPOOLED  conexión directa (sin -pooler) a la rama production de Neon
#   SEARCH_MAGIC_CONTACT   contacto para el User-Agent
name: Importar Scryfall

on:
  schedule:
    # Scryfall regenera el bulk data cada día hacia las 09:00 UTC.
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Reimportar aunque Scryfall no haya cambiado"
        type: boolean
        default: false

concurrency:
  group: scryfall-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      SEARCH_MAGIC_CONTACT: ${{ secrets.SEARCH_MAGIC_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Aplicar migraciones pendientes
        run: npm run db:migrate
      - name: Importar default_cards y nombres en español
        run: npm run db:import:scryfall -- ${{ inputs.force && '--force' || '' }}
