// El resto de cartas: ofertas deterministas, como en mock.ts
function seeded(seed) {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
  let a = h >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function weighted(rand, options) {
  const total = options.reduce((s, [, w]) => s + w, 0);
  let x = rand() * total;
  for (const [v, w] of options) { x -= w; if (x <= 0) return v; }
  return options[options.length - 1][0];
}
const COND_W = [["MT", 3], ["NM", 45], ["EX", 22], ["GD", 12], ["LP", 8], ["PL", 4], ["PO", 1], [null, 5]];
const COND_F = { MT: 1.1, NM: 1, EX: 0.92, GD: 0.85, LP: 0.75, PL: 0.6, PO: 0.4 };
const LANG_W = [["es", 44], ["en", 42], ["it", 3], ["fr", 3], ["de", 2], ["ja", 2]];

const OFFERS = {};
function offersFor(card) {
  if (OFFERS[card.id]) return OFFERS[card.id];
  let list = CURATED[card.id];
  if (!list) {
    list = [];
    for (const s of STORES) {
      const rand = seeded(s.id + ":" + card.id);
      if (rand() > 0.62) continue;
      const copies = 1 + Math.floor(rand() * 2);
      for (let i = 0; i < copies; i++) {
        const p = card.printings[Math.floor(rand() * card.printings.length)];
        const foil = p.refFoil != null && (p.ref == null || rand() < 0.28);
        const cond = weighted(rand, COND_W);
        const base = (foil ? p.refFoil : p.ref) * (0.84 + rand() * 0.4) * (cond ? COND_F[cond] : 0.9);
        const step = base > 2000 ? 50 : 5;
        const qty = rand() > 0.12 ? 1 + Math.floor(rand() * 4) : 0;
        list.push(O(s.id, p, cond, weighted(rand, LANG_W), foil ? "foil" : "nonfoil", Math.max(10, Math.round(base / step) * step), qty));
      }
    }
  }
  OFFERS[card.id] = list.slice().sort((a, b) => a.price - b.price || b.inStock - a.inStock);
  return OFFERS[card.id];
}
const inStockOf = (card) => offersFor(card).filter((o) => o.inStock);
const minPrice = (card) => { const l = inStockOf(card); return l.length ? Math.min(...l.map((o) => o.price)) : null; };
const refOf = (o) => (!o.p ? null : o.finish === "foil" ? o.p.refFoil : o.finish === "nonfoil" ? o.p.ref : null);

function searchCards(q) {
  const query = norm(q);
  if (query.length < 2) return [];
  const scored = [];
  for (const card of Object.values(CARDS)) {
    let best = null;
    for (const [name, lang] of [[card.es, "es"], [card.en, "en"]]) {
      const n = norm(name);
      const score = n.startsWith(query) ? 1 : n.split(/[\s,]+/).some((w) => w.startsWith(query)) ? 2 : n.includes(query) ? 3 : null;
      if (score != null && (!best || score < best.score)) best = { card, name, lang, score };
    }
    if (best) scored.push(best);
  }
  return scored.sort((a, b) => a.score - b.score || a.name.length - b.name.length);
}

}

function freshness(h) {

  }
  return `<span>${timeAgo(h)}</span>`;
}

function priceBlock(o, size = "text-base") {
  const ref = refOf(o);
  const d = diffPct(o.price, ref);
  const diff = d == null
    ? ""
    : `<p class="text-xs tabular-nums ${d <= -5 ? "font-medium text-good" : "text-ink-3"}" title="Cardmarket: ${fmtEur(ref)}">${fmtDiff(d)}<span class="sr-only"> respecto a Cardmarket</span></p>`;
  return `<p class="${size} font-semibold tabular-nums ${o.inStock ? "text-ink" : "text-ink-3"}">${fmtEur(o.price)}</p>${diff}`;
}

function applyFilters(list, f) {
  return list.filter((o) =>
    (!f.cities.length || f.cities.includes(o.store.city)) &&
    (!f.inStockOnly || o.inStock) &&
    (!f.finish || o.finish === f.finish) &&
    (!f.langs.length || (o.lang && f.langs.includes(o.lang))) &&
    (!f.minCond || (o.cond && CONDITIONS.indexOf(o.cond) <= CONDITIONS.indexOf(f.minCond))) &&
    (!f.set || (o.p && o.p.code === f.set)));
}

function activeFilters(f) {
  const out = [];
  f.cities.forEach((c) => out.push([CITY_LABELS[c], "rm-city", c]));
  if (f.finish) out.push([FINISH_LABELS[f.finish], "rm-finish", ""]);
  f.langs.forEach((l) => out.push([LANGUAGE_LABELS[l] || l, "rm-lang", l]));
  if (f.minCond) out.push([`${f.minCond} o mejor`, "rm-cond", ""]);
  if (f.set) out.push([`Edición ${f.set.toUpperCase()}`, "rm-set", ""]);
  if (!f.inStockOnly) out.push(["Incluye agotadas", "rm-stock", ""]);
  return out;
}

function filtersQuery(f) {
  const p = new URLSearchParams();
  if (f.cities.length === 1) p.append("ciudad", f.cities[0]);
  if (!f.inStockOnly) p.set("stock", "todo");
  if (f.finish) p.set("acabado", f.finish);
  f.langs.forEach((l) => p.append("idioma", l));
  if (f.minCond) p.set("estado", f.minCond);
  if (f.set) p.set("edicion", f.set);
  const q = p.toString();
  return q ? `?${q}` : "";
}

function filterControls(all, layout) {
  const f = state.filters;
  const langs = [...new Set(all.map((o) => o.lang).filter(Boolean))]
    .sort((a, b) => (["es", "en"].indexOf(a) + 1 || 9) - (["es", "en"].indexOf(b) + 1 || 9) || a.localeCompare(b));
  const city = field("Ciudad", segmented("city", [["", "Todas", !f.cities.length], ["barcelona", "Barcelona", f.cities.includes("barcelona")], ["hospitalet", "L'Hospitalet", f.cities.includes("hospitalet")]]));
  const finish = field("Acabado", segmented("finish", [["", "Todos", !f.finish], ["nonfoil", "Normal", f.finish === "nonfoil"], ["foil", "Foil", f.finish === "foil"], ["etched", "Etched", f.finish === "etched"]]));
  const lang = field("Idioma", `<div class="flex flex-wrap gap-1.5" role="group">${langs.map((l) =>
    `<button type="button" data-act="lang" data-v="${l}" aria-pressed="${f.langs.includes(l)}" title="${LANGUAGE_LABELS[l] || l}"
      class="h-9 min-w-10 rounded-xl border border-line bg-surface px-2.5 font-mono text-xs font-semibold uppercase text-ink-2 transition hover:border-line-strong aria-pressed:border-brand aria-pressed:bg-brand-soft aria-pressed:text-brand-strong">${l}</button>`).join("")}</div>`);
  const cond = field("Estado mínimo", `<div class="${layout === "bar" ? "w-52" : ""}">${selectBox("cond",
    [["", "Cualquiera"], ...CONDITIONS.map((c, i) => [c, `${CONDITION_LABELS[c]} (${c})${i === 0 ? "" : " o mejor"}`])], f.minCond, "Estado mínimo")}</div>`);
  const stock = switchControl("stock", f.inStockOnly, "Solo con stock");
  return { city, finish, lang, cond, stock };
}

function offerRow(o, best) {
  return `<tr class="border-t border-line transition ${best ? "bg-gold-soft/50" : "hover:bg-surface-2/60"}">
    <td class="py-3 pr-3 pl-4 ${best ? "shadow-[inset_3px_0_0_var(--gold)]" : ""}">
      <div class="flex flex-wrap items-center gap-x-2 gap-y-1"><span class="font-medium ${o.inStock ? "text-ink" : "text-ink-2"}">${o.store.name}</span>${best ? bestBadge() : ""}</div>
      <div class="mt-0.5 flex items-center gap-1.5 text-xs text-ink-3">${CITY_LABELS[o.store.city]}<span aria-hidden="true">·</span>${freshness(o.store.okH)}</div>
    </td>
    <td class="px-3 py-3">${printingInfo(o)}</td>
    <td class="px-3 py-3"><div class="flex flex-wrap items-center gap-1">${copyChips(o)}</div></td>

    <td class="py-3 pr-4 pl-3 text-right">${goStore(o.store.name)}</td>

}

function offerCard(o, best) {
  return `<li class="relative rounded-2xl border p-4 transition ${best ? "border-gold/70 bg-gold-soft/50" : "border-line bg-surface hover:border-line-strong"} ${o.inStock ? "" : "opacity-75"}">

      <span class="ml-1 inline-flex items-center gap-1 font-mono text-[11px] text-ink-3">${o.p ? `${o.p.code.toUpperCase()} #${o.p.number}` : "<i class='font-sans'>Edición ?</i>"}</span>
      <span class="ml-auto text-xs ${o.inStock ? "text-ink-2" : "font-medium text-ink-3"}">${stockLabel(o)}</span>
    </div>
    <a href="#" data-act="ext" data-v="${esc(o.store.name)}" class="absolute inset-0 rounded-2xl" aria-label="Ver en ${esc(o.store.name)}: ${fmtEur(o.price)} (se abre en una pestaña nueva)"></a>
  </li>`;
}

function screenCarta() {
  const card = CARDS[state.cardId] || CARDS.bolt;
  const f = state.filters;
  const all = offersFor(card);
  const list = applyFilters(all, f);
  const inStock = list.filter((o) => o.inStock);
  const best = inStock[0] || null;
  const storesCount = new Set(inStock.map((o) => o.store.id)).size;
  const sets = [...new Map(card.printings.map((p) => [p.code, p])).values()];
  const shown = f.set ? card.printings.find((p) => p.code === f.set) : card.printings[0];
  const refPrices = (f.set ? card.printings.filter((p) => p.code === f.set) : card.printings)
    .map((p) => (f.finish === "foil" ? p.refFoil : p.ref)).filter((v) => v != null);
  const ref = refPrices.length ? Math.min(...refPrices) : null;
  const freshest = Math.min(...all.map((o) => o.store.okH));
  const active = activeFilters(f);
  const controls = filterControls(all, "bar");

  const anyInStock = all.some((o) => o.inStock);

  const tile = (label, value, sub, gold = false) => `<div class="rounded-2xl border px-4 py-3 ${gold ? "border-gold/60 bg-gold-soft" : "border-line bg-surface"}">

      <dd class="mt-0.5 text-[1.4rem] leading-tight font-semibold tabular-nums">${value}</dd>
      <dd class="mt-0.5 truncate text-xs text-ink-2">${sub}</dd>
    </div>`;

  let offersBody;
  if (!list.length) {
    offersBody = !anyInStock && f.inStockOnly
      ? emptyState("inbox", `Ahora mismo ninguna tienda tiene ${card.es}`,
          `${all.length ? `Hay ${plural(all.length, "oferta agotada", "ofertas agotadas")} por si quieres preguntar en la tienda. ` : ""}${ref != null ? `Referencia en Cardmarket: ${fmtEur(ref)}.` : ""}`,
          all.length ? `<button type="button" data-act="rm-stock" class="${UI.buttonSecondary} mt-5">Ver agotadas</button>` : "")
      : emptyState("sliders", "Ninguna oferta con estos filtros",
          `Hay ${plural(all.filter((o) => o.inStock).length, "oferta", "ofertas")} de ${card.es} si quitas algún filtro.`,
          `<button type="button" data-act="clear" class="${UI.buttonSecondary} mt-5">${icon("x", "size-4")}Quitar filtros</button>`);
  } else {
    offersBody = `
      <div class="mt-4 hidden overflow-hidden rounded-2xl border border-line bg-surface lg:block">

        </table>

  }

  return `${appHeader("carta")}
  <main class="${UI.page} py-6 sm:py-10">
    <nav aria-label="Migas de pan" class="text-sm text-ink-3"><a href="#" data-act="go" data-v="resultados" class="hover:text-ink-2">Cartas</a> <span aria-hidden="true" class="mx-1">/</span> <span class="text-ink-2">${card.es}</span></nav>

function highlight(name, q) {
  const i = norm(name).indexOf(norm(q));
  if (i < 0 || !q) return esc(name);
  return `${esc(name.slice(0, i))}<mark class="bg-transparent font-semibold text-ink">${esc(name.slice(i, i + q.length))}</mark>${esc(name.slice(i + q.length))}`;
}

function acListHtml(items, q, activeIndex) {
  if (!items.length) {
    return `<div class="rounded-2xl border border-line bg-surface px-4 py-3 text-sm text-ink-3 shadow-pop">Sin coincidencias para «${esc(q)}»</div>`;
  }
  return `<ul role="listbox" class="overflow-hidden rounded-2xl border border-line bg-surface py-1.5 shadow-pop">${items.map((it, i) => `<li role="option" aria-selected="${i === activeIndex}">
    <button type="button" data-act="card" data-v="${it.card.id}" class="flex w-full items-center gap-3 px-4 py-2 text-left transition hover:bg-surface-2 ${i === activeIndex ? "bg-surface-2" : ""}">
      ${icon("search", "size-4 text-ink-3")}
      <span class="min-w-0 flex-1"><span class="block truncate text-sm text-ink-2">${highlight(it.name, q)}</span>${it.lang === "es" ? `<span class="block truncate text-xs text-ink-3">${it.card.en}</span>` : ""}</span>
      <span class="rounded-md px-1.5 py-0.5 font-mono text-[10px] font-semibold uppercase text-ink-3 ring-1 ring-inset ring-line">${it.lang}</span>
    </button></li>`).join("")}
    <li class="border-t border-line px-4 pt-2 pb-1 text-[11px] text-ink-3">↑↓ para moverte · Intro para abrir</li></ul>`;
}

const ac = { input: null, items: [], index: 0 };

function updateAutocomplete(input) {
  const box = input.form.querySelector("[data-ac-list]");
  const q = input.value.trim();
  ac.input = input;
  ac.items = searchCards(q).slice(0, 6);
  ac.index = 0;
  if (q.length < 2) { box.classList.add("hidden"); box.innerHTML = ""; return; }
  box.innerHTML = acListHtml(ac.items, q, ac.index);
  box.classList.remove("hidden");
}

  let stage;
  if (v.id === "sistema") {
    stage = screenSistema();
  } else if (state.device === "mobile") {
    const src = `${location.href.split(/[?#]/)[0]}?embed=1&view=${v.id}&theme=${theme}`;
    stage = `<div class="flex flex-col items-center gap-12 lg:flex-row lg:items-start lg:justify-center lg:gap-16">
      <div class="shrink-0 rounded-[48px] bg-[oklch(0.2_0.012_285)] p-3 shadow-pop ring-1 ring-black/10">
        <div class="relative overflow-hidden rounded-[38px]">
          <iframe title="${v.title} en móvil" src="${src}" class="block h-[800px] w-[390px] bg-canvas"></iframe>
        </div>
      </div>
      <div class="max-w-md lg:pt-4">
        <p class="mb-6 rounded-xl bg-surface-2 px-4 py-3 text-sm text-ink-2">Vista a 390 × 800 px (iPhone 15). Se puede usar: los enlaces y filtros funcionan dentro del teléfono.</p>
        ${notesHtml(v.id, "")}
      </div>
    </div>`;
  } else {
    stage = `<div class="overflow-clip rounded-2xl border border-line-strong bg-canvas shadow-pop">
        <div class="flex items-center gap-3 border-b border-line bg-surface-2 px-4 py-2.5">
          <div class="flex gap-1.5" aria-hidden="true"><span class="size-3 rounded-full bg-[#ff5f57]"></span><span class="size-3 rounded-full bg-[#febc2e]"></span><span class="size-3 rounded-full bg-[#28c840]"></span></div>
          <p class="mx-auto flex min-w-0 max-w-2xl flex-1 items-center gap-2 rounded-lg bg-surface px-3 py-1 font-mono text-xs text-ink-3 ring-1 ring-line">${icon("lock", "size-3")}<span class="truncate"><span class="text-ink-2">search-magic</span>${esc(routeOf(v.id))}</span></p>
          <span class="w-12"></span>
        </div>
        <div style="--sticky-top: 56px">${renderScreen(v.id)}</div>
      </div>
      <div class="mt-12">${notesHtml(v.id, "md:grid-cols-2 xl:grid-cols-3")}</div>`;
  }
  return `${docBar()}
  <main class="mx-auto max-w-[1440px] px-4 pt-8 pb-28 sm:px-6">
    <header class="mb-8 flex flex-wrap items-end justify-between gap-4">
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.12em] text-brand-strong">${v.id === "sistema" ? "Sistema" : "Pantalla"}</p>
        <h1 class="mt-1 font-display text-3xl font-semibold tracking-tight sm:text-4xl">${v.title}</h1>
        <p class="mt-2 max-w-3xl text-ink-2">${v.desc}</p>
      </div>
      ${v.id !== "sistema" ? `<p class="font-mono text-xs text-ink-3">${esc(routeOf(v.id))}</p>` : ""}
    </header>
    ${stage}
  </main>`;
}

// ===========================================================================
// Render y eventos
// ===========================================================================

const root = document.getElementById("root");
// Dentro del teléfono la barra de desplazamiento no ocupa sitio, como en un móvil de verdad
if (EMBED) document.documentElement.style.scrollbarWidth = "none";

function render() {
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset : null;
  const fAct = focused && focused.act, fV = focused && focused.v;
  root.innerHTML = EMBED ? renderScreen(state.view) : renderDoc();
  if (fAct) {
    const el = root.querySelector(`[data-act="${fAct}"]${fV != null ? `[data-v="${CSS.escape(fV)}"]` : ""}`);
    if (el) el.focus({ preventScroll: true });
  }
}

function savePrefs() {
  try {
    localStorage.setItem("sm-design-prefs", JSON.stringify({ device: state.device }));
    localStorage.setItem("sm-design-theme", state.theme);
  } catch (e) {}
}

function applyTheme() {
  const dark = state.theme === "dark" || (state.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}

function go(view, top = true) {
  state.view = view;
  if (!EMBED) history.replaceState(null, "", "#" + view);
  render();
  if (top) window.scrollTo({ top: 0 });
}

let toastTimer;
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    t.setAttribute("role", "status");
    t.className = "pointer-events-none fixed bottom-6 left-1/2 z-[60] max-w-[90vw] -translate-x-1/2 rounded-xl bg-ink px-4 py-2.5 text-sm font-medium text-canvas shadow-pop transition-opacity duration-300";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.opacity = "0"), 2400);
}

root.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
  const act = el.dataset.act, v = el.dataset.v ?? "";
  const f = state.filters;
  if (act !== "anchor") e.preventDefault();
  switch (act) {
    case "tab": state.view = v; history.replaceState(null, "", "#" + v); render(); window.scrollTo({ top: 0 }); break;
    case "device": state.device = v; savePrefs(); render(); break;
    case "theme": state.theme = v; savePrefs(); applyTheme(); render(); break;
    case "go": go(v); break;
    case "card": state.cardId = v; state.filters = DEFAULT_FILTERS(); go("carta"); break;
    case "query": state.query = v; go("resultados"); break;
    case "product": state.productId = v; render(); break;
    case "ext": toast(`En la web real se abre la ficha de ${v} en una pestaña nueva.`); break;
    case "noop": toast("Solo maqueta: este botón no hace nada todavía."); break;
    case "anchor": break;
    case "city": {
      if (!v) f.cities = [];
      else f.cities = f.cities.includes(v) ? f.cities.filter((c) => c !== v) : [...f.cities, v];
      if (f.cities.length === 2) f.cities = [];
      render(); break;
    }
    case "finish": f.finish = v || null; render(); break;
    case "lang": f.langs = f.langs.includes(v) ? f.langs.filter((l) => l !== v) : [...f.langs, v]; render(); break;
    case "set": f.set = v || null; render(); break;
    case "rm-city": f.cities = f.cities.filter((c) => c !== v); render(); break;
    case "rm-finish": f.finish = null; render(); break;
    case "rm-lang": f.langs = f.langs.filter((l) => l !== v); render(); break;
    case "rm-cond": f.minCond = null; render(); break;
    case "rm-set": f.set = null; render(); break;
    case "rm-stock": f.inStockOnly = !f.inStockOnly; render(); break;
    case "clear": state.filters = DEFAULT_FILTERS(); render(); break;
  }
});

root.addEventListener("change", (e) => {
  const act = e.target.dataset && e.target.dataset.act;
  if (act === "cond") { state.filters.minCond = e.target.value || null; render(); }
  if (act === "stock") { state.filters.inStockOnly = e.target.checked; render(); }
});

root.addEventListener("toggle", (e) => {
  if (e.target.matches && e.target.matches("[data-mobile-filters]")) state.mobileFiltersOpen = e.target.open;
}, true);

root.addEventListener("input", (e) => {
  if (e.target.matches("[data-ac-input]")) updateAutocomplete(e.target);
});

root.addEventListener("keydown", (e) => {
  if (!e.target.matches("[data-ac-input]") || !ac.items.length) return;
  const box = e.target.form.querySelector("[data-ac-list]");
  if (box.classList.contains("hidden")) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    ac.index = (ac.index + (e.key === "ArrowDown" ? 1 : -1) + ac.items.length) % ac.items.length;
    box.innerHTML = acListHtml(ac.items, e.target.value.trim(), ac.index);
  } else if (e.key === "Enter") {
    e.preventDefault();
    state.cardId = ac.items[ac.index].card.id;
    state.filters = DEFAULT_FILTERS();
    go("carta");
  } else if (e.key === "Escape") {
    box.classList.add("hidden");
  }
});

root.addEventListener("submit", (e) => {
  if (!e.target.matches("[data-search]")) return;
  e.preventDefault();
  const q = e.target.querySelector("input").value.trim();
  if (!q) return;
  state.query = q;
  go("resultados");
});

document.addEventListener("click", (e) => {
  if (!e.target.closest("[data-search]")) root.querySelectorAll("[data-ac-list]").forEach((b) => b.classList.add("hidden"));
});

document.addEventListener("keydown", (e) => {
  if (e.key !== "/" || e.target.matches("input, textarea, select")) return;
  const input = root.querySelector("#q-header, #q-home");
  if (input && input.offsetParent) { e.preventDefault(); input.focus(); }
});

// Imagen de Scryfall que no carga (sin conexión): queda el nombre de la carta debajo
document.addEventListener("error", (e) => {
  if (e.target instanceof HTMLImageElement && e.target.hasAttribute("data-card")) e.target.style.visibility = "hidden";
}, true);

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (state.theme === "system") { applyTheme(); render(); }
});

window.addEventListener("hashchange", () => {
  const v = location.hash.slice(1);
  if (!EMBED && VIEWS.some((x) => x.id === v) && v !== state.view) { state.view = v; render(); }
});

render();
</script>
</body>
</html>
