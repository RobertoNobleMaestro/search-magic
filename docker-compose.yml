# Postgres local para quien clone el repo sin acceso a Neon.
# Uso: docker compose up -d && npm run db:migrate && npm run db:import:scryfall
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: search_magic
      POSTGRES_USER: search_magic
      POSTGRES_PASSWORD: search_magic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search_magic -d search_magic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
